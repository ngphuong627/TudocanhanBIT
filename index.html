<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Đăng Nhập / Đăng Ký</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="login-box">
        
        <form id="loginForm">
            <h2>Đăng nhập</h2>
            
            <div class="input-group">
                <label>Tên đăng nhập</label>
                <input type="text" placeholder="Nhập tên đăng nhập">
            </div>
            
            <div class="input-group">
                <label>Mật khẩu</label>
                <input type="password" placeholder="Nhập mật khẩu">
            </div>

            <button type="submit" class="btn-primary">Đăng nhập</button>
            
            <div class="extra-links">
                <a href="#" id="toForgot" class="forgot-pass">Quên mật khẩu</a>
                
                <a href="https://accounts.google.com" target="_blank" class="btn-google">
                    <svg width="18" height="18" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                    </svg>
                    <span>Đăng nhập bằng Google</span>
                </a>

                <p class="switch-form-text">
                    Bạn chưa có tài khoản? <a href="#" id="toRegister">Đăng ký</a>
                </p>
            </div>
        </form>

        <form id="registerForm" class="hidden">
            <h2>Đăng ký</h2>

            <div class="input-group">
                <label>Họ và tên</label>
                <input type="text" placeholder="Nhập họ và tên">
            </div>

            <div class="input-group">
                <label>Email</label>
                <input type="email" placeholder="Nhập email">
            </div>

            <div class="input-group">
                <label>Số điện thoại</label>
                <input type="text" placeholder="Nhập số điện thoại">
            </div>
            
            <div class="input-group">
                <label>Tạo mật khẩu</label>
                <input type="password" placeholder="Tạo mật khẩu">
            </div>

            <div class="input-group">
                <label>Nhập lại mật khẩu</label>
                <input type="password" placeholder="Nhập lại mật khẩu">
            </div>

            <button type="submit" class="btn-primary">Đăng ký</button>
            
            <div class="extra-links">
                <span class="sub-text">Hoặc</span>
                
                <a href="https://accounts.google.com" target="_blank" class="btn-google">
                    <svg width="18" height="18" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                    </svg>
                    <span>Tiếp tục với Google</span>
                </a>

                <p class="switch-form-text">
                    Đã có tài khoản? <a href="#" class="toLogin">Đăng nhập</a>
                </p>
            </div>
        </form>

        <form id="forgotForm" class="hidden">
            <h2>Quên mật khẩu</h2>
            
            <div class="input-group">
                <label>Email khôi phục</label>
                <input type="email" placeholder="Nhập email của bạn">
            </div>

            <button type="submit" class="btn-primary">Gửi yêu cầu</button>
            
            <div class="extra-links">
                <p class="switch-form-text">
                    Nhớ mật khẩu rồi? <a href="#" class="toLogin">Quay lại Đăng nhập</a>
                </p>
            </div>
        </form>

    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const forgotForm = document.getElementById('forgotForm');

        const toRegister = document.getElementById('toRegister');
        const toForgot = document.getElementById('toForgot');
        const toLoginBtns = document.querySelectorAll('.toLogin');

        toRegister.addEventListener('click', (e) => {
            e.preventDefault();
            loginForm.classList.add('hidden');
            forgotForm.classList.add('hidden');
            registerForm.classList.remove('hidden');
        });

        toForgot.addEventListener('click', (e) => {
            e.preventDefault();
            loginForm.classList.add('hidden');
            registerForm.classList.add('hidden');
            forgotForm.classList.remove('hidden');
        });

        toLoginBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                registerForm.classList.add('hidden');
                forgotForm.classList.add('hidden');
                loginForm.classList.remove('hidden');
            });
        });
    </script>
</body>
</html>
